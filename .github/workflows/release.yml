name: release

# Publishes a release after a merge to main whose CI run passed. The version comes
# from the commits since the latest tag; see .github/scripts/next-version.sh.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish GitHub Release
    runs-on: homelab
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute next version
        id: version
        run: |
          tag=$(.github/scripts/next-version.sh "${{ github.event.workflow_run.head_sha }}")
          if [ -z "$tag" ]; then
            echo "No releasable commits since the last tag; skipping."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build binary
        if: steps.version.outputs.tag != ''
        run: |
          make build VERSION="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp build/pvdu dist/pvdu-linux-amd64
          (cd dist && sha256sum pvdu-linux-amd64 > checksums.txt)

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/pvdu-linux-amd64 dist/checksums.txt \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "pvdu ${{ steps.version.outputs.tag }}" \
            --generate-notes
