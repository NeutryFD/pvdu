name: release

# Publishes after merging a PR validated by main's required, up-to-date CI checks.
# The version comes from commits since the latest tag; see .github/scripts/next-version.sh.
on:
  push:
    branches: [main]
    # Keep in sync with the non-code filter in ci.yml.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
      - .gitignore
      - .editorconfig
      - .github/dependabot.yml
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish GitHub Release
    runs-on: homelab
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute next version
        id: version
        run: |
          tag=$(.github/scripts/next-version.sh "${{ github.sha }}")
          if [ -z "$tag" ]; then
            echo "No releasable commits since the last tag; skipping."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build binary
        if: steps.version.outputs.tag != ''
        run: |
          make build VERSION="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp build/pvdu dist/pvdu-linux-amd64
          (cd dist && sha256sum pvdu-linux-amd64 > checksums.txt)

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/pvdu-linux-amd64 dist/checksums.txt \
            --target "${{ github.sha }}" \
            --title "pvdu ${{ steps.version.outputs.tag }}" \
            --generate-notes
