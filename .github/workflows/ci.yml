name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the slow KinD job is needed. Lint and unit tests always run.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cluster: ${{ steps.filter.outputs.cluster }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$PR" ]; then
            echo "cluster=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          # Documentation and Dependabot config never need a cluster.
          other=$(echo "$files" | grep -Ev '^(.*\.md|LICENSE|\.github/dependabot\.yml)$' || true)
          # Dependabot Actions bumps only touch workflow files.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            other=$(echo "$other" | grep -Ev '^\.github/workflows/' || true)
          fi
          if [ -z "$other" ]; then
            echo "cluster=false" >> "$GITHUB_OUTPUT"
          else
            echo "cluster=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # cmd/pvdu embeds the scanner payloads, so they must exist to type-check.
      - name: Build scanner payloads
        run: make scanner

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test-unit

  integration:
    name: integration tests (KinD)
    needs: changes
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start KinD cluster
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind
          ./kind create cluster --wait 120s

      - name: Integration tests
        run: make test-integration

  # Single required check for branch protection. A job skipped on purpose (the
  # KinD job for docs-only changes) is fine; a failed or cancelled one is not.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [changes, lint, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
